<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Background Gradient: Forest Green to Bright Emerald -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
    
    <!-- Glow/Light Source -->
    <radialGradient id="glow" cx="50%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#34d399" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#064e3b" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Premium rounded card body (squircle shape) -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect width="512" height="512" rx="128" fill="url(#glow)" style="mix-blend-mode: screen;" />

  <!-- Beautiful Stylized Seedling/Plant Logo in the center -->
  <g transform="translate(146, 126)">
    <!-- Central Stem -->
    <path d="M110 260 V 90" stroke="#ffffff" stroke-width="20" stroke-linecap="round" />
    
    <!-- Right Leaf (Large, organic curves) -->
    <path d="M110 100 C 110 30, 210 20, 210 100 C 210 180, 110 170, 110 170 Z" fill="#ffffff" />
    
    <!-- Left Leaf (Slightly lower, balanced asymmetry) -->
    <path d="M110 160 C 110 100, 10 90, 10 160 C 10 230, 110 220, 110 220 Z" fill="#ffffff" opacity="0.9" />

    <!-- Stylized Soil/Earth arcs at base -->
    <path d="M50 250 A 60 60 0 0 1 170 250" stroke="#ffffff" stroke-width="12" stroke-linecap="round" fill="none" opacity="0.7" />
    <path d="M20 260 A 90 90 0 0 1 200 260" stroke="#ffffff" stroke-width="8" stroke-linecap="round" fill="none" opacity="0.4" />
  </g>
</svg>