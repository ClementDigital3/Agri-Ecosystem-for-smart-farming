version: "1"

services:
  # ---------------------------------------------
  # 1. SHAMBAIQ BACKEND API (Node.js)
  # ---------------------------------------------
  - type: web
    name: shambaiq-api
    env: node
    rootDir: SHAMBAIQ
    buildCommand: "npm install"
    startCommand: "npm start"
    plan: free

  # ---------------------------------------------
  # 2. SHAMBAIQ TACTICAL DASHBOARD (React Static Site)
  # ---------------------------------------------
  - type: web
    name: shambaiq-app
    env: static
    rootDir: SHAMBAIQ
    buildCommand: "npm install && npm run build"
    staticPublishPath: "dist"
    routes:
      - type: rewrite
        source: "/*"
        destination: "/index.html"
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: shambaiq-api
          envVarKey: RENDER_EXTERNAL_URL
